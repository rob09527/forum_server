name: build-and-push

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest # amd64，无 QEMU，原生编译/预编译原生模块
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
          tags: |
            ghcr.io/rob09527/forum-server:latest
            ghcr.io/rob09527/forum-server:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,scope=forum-server
          cache-to: type=gha,mode=max,scope=forum-server
